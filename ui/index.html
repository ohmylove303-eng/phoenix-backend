<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOENIX 종합 분석 시스템 | PALANTIR V2</title>
    <script src="https://unpkg.com/lightweight-charts@4.0.0/dist/lightweight-charts.standalone.production.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --surface: #0a0a0a;
            --border: #1a1a1a;
            --text: #f0f0f0;
            --text-dim: #666;
            --green: #00ff9d;
            --red: #ff0055;
            --accent: #00b4ff;
            --orange: #ff9900;
            --purple: #bb66ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* ===== 헤더 ===== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--accent);
        }

        .logo span {
            color: var(--text-dim);
        }

        .badge {
            background: linear-gradient(135deg, var(--accent), var(--purple));
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--red);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.active {
            background: var(--green);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .header-time {
            font-size: 12px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono';
        }

        /* ===== 메인 레이아웃 ===== */
        main {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            height: calc(100vh - 52px);
            overflow: hidden;
        }

        /* ===== 왼쪽 사이드바: 코인 목록 + 추천 ===== */
        .sidebar-left {
            background: var(--surface);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* ===== 탭 네비게이션 ===== */
        .tab-nav {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: #0d0d0d;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--accent);
            background: var(--surface);
            border-bottom: 2px solid var(--accent);
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
        }

        .tab-content.active {
            display: block;
        }

        /* ===== 코인 리스트 ===== */
        .coin-item {
            display: grid;
            grid-template-columns: 1fr 50px 65px;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }

        .coin-item:hover {
            background: #111;
        }

        .coin-item.selected {
            background: #0a1a2a;
            border-left: 3px solid var(--accent);
        }

        .coin-name {
            font-weight: 600;
            font-size: 13px;
        }

        .coin-price {
            font-size: 11px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono';
        }

        .coin-score {
            font-size: 11px;
            font-weight: 700;
            font-family: 'JetBrains Mono';
            padding: 2px 6px;
            border-radius: 4px;
            text-align: center;
        }

        .coin-score.high {
            background: rgba(0, 255, 157, 0.2);
            color: var(--green);
        }

        .coin-score.medium {
            background: rgba(255, 180, 0, 0.2);
            color: var(--orange);
        }

        .coin-score.low {
            background: rgba(255, 0, 85, 0.2);
            color: var(--red);
        }

        .coin-change {
            font-size: 11px;
            font-weight: 600;
            text-align: right;
            font-family: 'JetBrains Mono';
        }

        .coin-change.up {
            color: var(--green);
        }

        .coin-change.down {
            color: var(--red);
        }

        /* ===== 추천 섹션 ===== */
        .recommend-section {
            padding: 10px;
        }

        .recommend-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px dashed var(--border);
        }

        .recommend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            background: #0d0d0d;
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .recommend-item:hover {
            background: #111;
        }

        .rec-symbol {
            font-weight: 700;
            font-size: 12px;
        }

        .rec-info {
            font-size: 11px;
            font-family: 'JetBrains Mono';
        }


        /* ===== 중앙: 차트 ===== */
        .chart-area {
            display: flex;
            flex-direction: column;
            background: #030303;
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
        }

        .chart-symbol {
            font-size: 18px;
            font-weight: 900;
            color: #fff;
        }

        .chart-price {
            font-size: 16px;
            font-family: 'JetBrains Mono';
            color: var(--green);
            margin-left: 10px;
        }

        .timeframe-tabs {
            display: flex;
            gap: 2px;
            background: #0d0d0d;
            padding: 2px;
            border-radius: 4px;
        }

        .tf-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 11px;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 2px;
        }

        .tf-btn.active {
            background: #222;
            color: #fff;
        }

        .chart-container {
            flex: 1;
            position: relative;
        }

        #tv-chart {
            position: absolute;
            width: 100%;
            height: 100%;
        }


        /* ===== 오른쪽: 분석 패널 ===== */
        .sidebar-right {
            background: var(--surface);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding: 15px;
        }

        .analysis-card {
            background: #0d0d0d;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .tech-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .tech-label {
            color: #888;
        }

        .tech-value {
            font-family: 'JetBrains Mono';
            font-weight: 600;
        }

        .tech-value.bullish {
            color: var(--green);
        }

        .tech-value.bearish {
            color: var(--red);
        }

        .tech-value.neutral {
            color: var(--text-dim);
        }

        /* 매수/매도 레벨 */
        .trade-level {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .trade-level.buy {
            background: rgba(0, 255, 157, 0.1);
        }

        .trade-level.sell {
            background: rgba(255, 0, 85, 0.1);
        }

        .trade-level.stop {
            background: rgba(255, 153, 0, 0.1);
        }

        .level-label {
            font-size: 11px;
            font-weight: 600;
        }

        .level-price {
            font-size: 13px;
            font-weight: 700;
            font-family: 'JetBrains Mono';
        }

        .level-label.buy {
            color: var(--green);
        }

        .level-label.sell {
            color: var(--red);
        }

        .level-label.stop {
            color: var(--orange);
        }

        /* 매집 분석 */
        .accumulation-meter {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            margin: 8px 0;
            overflow: hidden;
        }

        .accumulation-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--purple));
            width: 0%;
            transition: width 0.5s;
        }

        .accumulation-signals {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 5px;
        }

        .signal-tag {
            font-size: 9px;
            padding: 2px 5px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 3px;
            color: #ccc;
        }

        /* AI 에이전트 바 (V4) */
        .agent-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .agent-name {
            width: 50px;
            font-size: 10px;
            color: var(--text-dim);
            text-align: right;
        }

        .agent-track {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .agent-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }

        .agent-fill.technical {
            background: var(--accent);
        }

        .agent-fill.onchain {
            background: var(--purple);
        }

        .agent-fill.sentiment {
            background: var(--red);
        }

        .agent-fill.macro {
            background: var(--orange);
        }

        .agent-fill.institutional {
            background: var(--green);
        }

        .agent-value {
            width: 30px;
            text-align: right;
            font-size: 10px;
            font-family: 'JetBrains Mono';
            color: var(--text-dim);
        }

        /* 스크롤바 */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="logo">PHOENIX<span>_SYS</span></div>
            <div class="badge">PALANTIR V2</div>
        </div>
        <div class="header-info">
            <div class="status-dot" id="ws-status"></div>
            <div class="header-time" id="header-time">로딩 중...</div>
        </div>
    </header>

    <main>
        <!-- 왼쪽: 코인 목록 + 추천 -->
        <div class="sidebar-left">
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="coins">실시간 현황</button>
                <button class="tab-btn" data-tab="recommend">추천 종목</button>
            </div>

            <!-- 실시간 코인 목록 -->
            <div class="tab-content active" id="tab-coins">
                <div id="coin-list"></div>
            </div>

            <!-- 추천 종목 -->
            <div class="tab-content" id="tab-recommend">
                <div class="recommend-section">
                    <div class="recommend-title">📈 메이저 추천 (5종)</div>
                    <div id="major-list"></div>
                </div>
                <div class="recommend-section">
                    <div class="recommend-title">⚡ 단타 추천 (시간대 기반)</div>
                    <div id="scalp-list"></div>
                </div>
                <div class="recommend-section">
                    <div class="recommend-title">📊 스윙 추천 (단기)</div>
                    <div id="swing-list"></div>
                </div>
            </div>
        </div>

        <!-- 중앙: 차트 -->
        <div class="chart-area">
            <div class="chart-header">
                <div>
                    <div class="chart-symbol" id="chart-symbol">BTC/KRW</div>
                    <div class="chart-price" id="chart-price">₩0</div>
                </div>
                <div class="timeframe-tabs">
                    <button class="tf-btn" data-tf="1m">1분</button>
                    <button class="tf-btn" data-tf="5m">5분</button>
                    <button class="tf-btn" data-tf="15m">15분</button>
                    <button class="tf-btn" data-tf="30m">30분</button>
                    <button class="tf-btn active" data-tf="1h">1시간</button>
                    <button class="tf-btn" data-tf="4h">4시간</button>
                    <button class="tf-btn" data-tf="1d">일봉</button>
                    <button class="tf-btn" data-tf="1w">주봉</button>
                </div>
            </div>
            <div class="chart-container">
                <div id="tv-chart"></div>
            </div>
        </div>

        <!-- 오른쪽: 분석 패널 -->
        <div class="sidebar-right">
            <!-- 기술적 분석 -->
            <div class="analysis-card">
                <div class="card-title">기술적 분석</div>
                <div class="tech-row">
                    <span class="tech-label">RSI (14)</span>
                    <span class="tech-value" id="rsi-value">--</span>
                </div>
                <div class="tech-row">
                    <span class="tech-label">피보나치 위치</span>
                    <span class="tech-value" id="fib-position">--</span>
                </div>
                <!-- V4 에서는 필요시 추가 확장 -->
            </div>

            <!-- Kelly & Guard Chain -->
            <div class="analysis-card">
                <div class="card-title">운용 전략 (Kelly & Guard)</div>
                <div class="tech-row">
                    <span class="tech-label">Kelly 비중</span>
                    <span class="tech-value" id="kelly-percent">--%</span>
                </div>
                <div class="tech-row">
                    <span class="tech-label">권장 포지션</span>
                    <span class="tech-value" id="kelly-size">-- KRW</span>
                </div>
                <div class="tech-row">
                    <span class="tech-label">Guard Chain</span>
                    <span class="tech-value" id="guard-status">--</span>
                </div>
            </div>

            <!-- 매수/매도 레벨 -->
            <div class="analysis-card">
                <div class="card-title">매매 제안가</div>
                <div class="trade-level buy">
                    <span class="level-label buy">매수 진입</span>
                    <span class="level-price" id="buy-level">--</span>
                </div>
                <div class="trade-level sell">
                    <span class="level-label sell">목표 매도</span>
                    <span class="level-price" id="sell-level">--</span>
                </div>
                <div class="trade-level stop">
                    <span class="level-label stop">손절 라인</span>
                    <span class="level-price" id="stop-level">--</span>
                </div>
            </div>

            <!-- AI 에이전트 점수 -->
            <div class="analysis-card">
                <div class="card-title">NICE V4 5-Layer AI</div>
                <div class="agent-bar">
                    <span class="agent-name">기술적</span>
                    <div class="agent-track">
                        <div class="agent-fill technical" id="bar-technical"></div>
                    </div>
                    <span class="agent-value" id="score-technical">--</span>
                </div>
                <div class="agent-bar">
                    <span class="agent-name">온체인</span>
                    <div class="agent-track">
                        <div class="agent-fill onchain" id="bar-onchain"></div>
                    </div>
                    <span class="agent-value" id="score-onchain">--</span>
                </div>
                <div class="agent-bar">
                    <span class="agent-name">심리</span>
                    <div class="agent-track">
                        <div class="agent-fill sentiment" id="bar-sentiment"></div>
                    </div>
                    <span class="agent-value" id="score-sentiment">--</span>
                </div>
                <div class="agent-bar">
                    <span class="agent-name">매크로</span>
                    <div class="agent-track">
                        <div class="agent-fill macro" id="bar-macro"></div>
                    </div>
                    <span class="agent-value" id="score-macro">--</span>
                </div>
                <div class="agent-bar">
                    <span class="agent-name">기관</span>
                    <div class="agent-track">
                        <div class="agent-fill institutional" id="bar-institutional"></div>
                    </div>
                    <span class="agent-value" id="score-institutional">--</span>
                </div>
            </div>

            <!-- AI 요약 -->
            <div class="analysis-card">
                <div class="card-title">AI 종합 판정</div>
                <div class="ai-summary" id="ai-summary">분석 중...</div>
            </div>
        </div>
    </main>

    <script>
        // ===== 설정 =====
        const API_BASE = "https://web-production-8dd8b.up.railway.app";
        // 로컬 테스트용
        // const API_BASE = "http://localhost:5002"; 

        let selectedSymbol = "BTC";
        let selectedTimeframe = "1h";
        let chart, candleSeries;

        // ===== DOM =====
        const elCoinList = document.getElementById('coin-list');
        const elMajorList = document.getElementById('major-list');
        const elScalpList = document.getElementById('scalp-list');
        const elSwingList = document.getElementById('swing-list');

        // ===== 차트 초기화 =====
        function initChart() {
            const container = document.getElementById('tv-chart');
            chart = LightweightCharts.createChart(container, {
                layout: { background: { color: '#030303' }, textColor: '#666' },
                grid: { vertLines: { color: '#0a0a0a' }, horzLines: { color: '#0a0a0a' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { borderColor: '#1a1a1a', timeVisible: true, secondsVisible: false },
                rightPriceScale: { borderColor: '#1a1a1a' }
            });
            candleSeries = chart.addCandlestickSeries({
                upColor: '#00ff9d', downColor: '#ff0055',
                borderVisible: false, wickUpColor: '#00ff9d', wickDownColor: '#ff0055'
            });

            new ResizeObserver(entries => {
                if (entries.length) {
                    const rect = entries[0].contentRect;
                    chart.applyOptions({ width: rect.width, height: rect.height });
                }
            }).observe(container);
        }

        // ===== API 호출 =====
        async function fetchChartData(symbol, tf) {
            try {
                // 기존 API 유지
                const res = await fetch(`${API_BASE}/api/chart-data/${symbol}?tf=${tf}`);
                if (!res.ok) throw new Error('API Error');
                return await res.json();
            } catch (e) {
                console.error('Chart data error:', e);
                return null;
            }
        }

        async function fetchAgentSignals() {
            try {
                const symbols = 'BTC,ETH,XRP,SOL,ADA,DOGE,AVAX,DOT,MATIC,ATOM,LINK,UNI,NEAR,APT,ARB';
                const res = await fetch(`${API_BASE}/api/agents/signals?symbols=${symbols}`);
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();
                document.getElementById('ws-status').classList.add('active');
                return data.signals || [];
            } catch (e) {
                console.error('Signals error:', e);
                document.getElementById('ws-status').classList.remove('active');
                return [];
            }
        }

        async function fetchRecommendations() {
            try {
                const res = await fetch(`${API_BASE}/api/recommend/all`);
                if (!res.ok) throw new Error('API Error');
                return await res.json();
            } catch (e) {
                console.error('Recommendations error:', e);
                return null;
            }
        }

        async function fetchComprehensiveAnalysis(symbol) {
            try {
                const res = await fetch(`${API_BASE}/api/v4/signal/${symbol}`);
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();
                renderAnalysis(data);
                return data;
            } catch (e) {
                console.error('Analysis error:', e);
                document.getElementById('ai-summary').innerHTML = `<span style="color:var(--red)">데이터 로드 실패</span>`;
            }
        }

        // ===== 렌더링 =====
        function renderAnalysis(data) {
            if (!data) return;

            // 1. 매매 제안가 (Kelly 기반)
            const kelly = data.kelly || {};
            if (kelly.entry_price) {
                document.getElementById('buy-level').textContent = Math.round(kelly.entry_price).toLocaleString();
                document.getElementById('stop-level').textContent = Math.round(kelly.stop_loss || 0).toLocaleString();
                document.getElementById('sell-level').textContent = Math.round(kelly.take_profit || 0).toLocaleString();

                document.getElementById('kelly-percent').textContent = (kelly.kelly_percent || 0) + '%';
                document.getElementById('kelly-percent').style.color = kelly.kelly_percent > 0 ? 'var(--green)' : 'var(--text-dim)';

                document.getElementById('kelly-size').textContent = Math.round(kelly.position_size_krw || 0).toLocaleString() + ' KRW';
            }

            // 2. Guard Chain 상태
            const guard = data.guard_chain || {};
            const guardEl = document.getElementById('guard-status');
            if (guard.passed) {
                guardEl.innerHTML = `<span style="color:var(--green)">✅ PASS (${Math.round(guard.execution_time_ms || 0)}ms)</span>`;
            } else {
                guardEl.innerHTML = `<span style="color:var(--red)">⛔ BLOCKED (${guard.reason || 'Unknown'})</span>`;
            }

            // 3. 5 Agent 점수
            const scores = data.agent_scores || {};
            updateAgentBar('technical', scores.technical || 50);
            updateAgentBar('onchain', scores.onchain || 50);
            updateAgentBar('sentiment', scores.sentiment || 50);
            updateAgentBar('macro', scores.macro || 50);
            updateAgentBar('institutional', scores.institutional || 50);

            // 4. 종합 판정
            const typeInfo = data.signal_type || {};
            const type = typeInfo.type || 'WAIT';
            const conf = typeInfo.confidence || 0;
            const action = typeInfo.action || '관망';

            let typeColor = 'var(--text-dim)';
            if (type === 'A') typeColor = 'var(--green)';
            if (type === 'B') typeColor = 'var(--orange)';
            if (type === 'C') typeColor = 'var(--accent)';
            if (type === 'WAIT' || type === 'SELL') typeColor = 'var(--red)';

            const summaryHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <span style="font-size:18px; font-weight:900; color:${typeColor}">TYPE ${type}</span>
                    <span style="font-size:12px; color:var(--text-dim)">신뢰도 ${conf}%</span>
                </div>
                <div style="font-size:14px; margin-bottom:10px; font-weight:700;">
                    ${action}
                </div>
                <div style="font-size:12px; line-height:1.4; color:#ccc;">
                    종합 점수: <span style="color:${typeColor}">${Math.round(data.weighted_score || 0)}/100</span><br>
                    NICE Engine V4.0 가동 중
                </div>
            `;

            document.getElementById('ai-summary').innerHTML = summaryHTML;

            // 기술적 지표 Renders
            if (data.agent_detail && data.agent_detail.technical) {
                const tech = data.agent_detail.technical;
                document.getElementById('rsi-value').textContent = tech.rsi || '--';
            }
        }

        function updateAgentBar(id, score) {
            const bar = document.getElementById(`bar-${id}`);
            const val = document.getElementById(`score-${id}`);
            if (bar && val) {
                bar.style.width = `${score}%`;
                val.textContent = score;
                if (score >= 70) val.style.color = 'var(--green)';
                else if (score <= 30) val.style.color = 'var(--red)';
                else val.style.color = 'var(--text-dim)';
            }
        }

        function renderCoinList(coins) {
            elCoinList.innerHTML = coins.map(c => {
                const isUp = c.change_rate >= 0;
                const changeClass = isUp ? 'up' : 'down';
                const sign = isUp ? '+' : '';
                const scoreClass = (c.weighted_score >= 70) ? 'high' : (c.weighted_score >= 40 ? 'medium' : 'low');
                const isSelected = c.symbol === selectedSymbol ? 'selected' : '';

                return `
                    <div class="coin-item ${isSelected}" onclick="selectCoin('${c.symbol}')">
                        <div class="coin-name">${c.symbol}</div>
                        <div class="coin-score ${scoreClass}">${Math.round(c.weighted_score || 0)}</div>
                        <div class="coin-price">
                            <div>${Math.round(c.price || 0).toLocaleString()}</div>
                            <div class="coin-change ${changeClass}">${sign}${(c.change_rate || 0).toFixed(2)}%</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderRecommendations(data) {
            if (!data) return;
            renderRecList(elMajorList, data.major?.recommendations);
            renderRecList(elScalpList, data.scalp?.recommendations);
            renderRecList(elSwingList, data.swing_short?.recommendations);
        }

        function renderRecList(el, items) {
            if (!el) return;
            if (!items || items.length === 0) {
                el.innerHTML = '<div style="padding:10px; color:#444; font-size:11px;">추천 없음</div>';
                return;
            }

            el.innerHTML = items.map(item => {
                const typeColor = item.signal_type === 'BUY' ? 'var(--green)' : 'var(--orange)';
                return `
                <div class="recommend-item" onclick="selectCoin('${item.symbol}')">
                    <div class="rec-symbol">${item.symbol}</div>
                    <div class="rec-info">
                        <span style="color:${typeColor}">${item.signal_type}</span>
                        <span style="margin-left:5px; color:#666;">${item.score}점</span>
                    </div>
                </div>
                `;
            }).join('');
        }

        function selectCoin(symbol) {
            selectedSymbol = symbol;
            document.getElementById('chart-symbol').textContent = symbol + "/KRW";

            // UI 선택 효과
            const items = document.querySelectorAll('.coin-item');
            items.forEach(el => {
                if (el.querySelector('.coin-name').textContent === symbol) {
                    el.classList.add('selected');
                } else {
                    el.classList.remove('selected');
                }
            });

            // 상세 분석 갱신
            fetchComprehensiveAnalysis(symbol);
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('header-time').textContent = now.toLocaleTimeString('ko-KR');
        }

        async function updateChart() {
            // 차트 갱신: 실제 구현 시 fetchChartData 결과를 candleSeries에 반영
            const data = await fetchChartData(selectedSymbol, selectedTimeframe);
            if (data && data.candles) {
                candleSeries.setData(data.candles);

                // 가격 업데이트
                const last = data.candles[data.candles.length - 1];
                if (last) {
                    const priceEl = document.getElementById('chart-price');
                    priceEl.textContent = `₩${last.close.toLocaleString()}`;

                    const isUp = last.close >= last.open;
                    priceEl.style.color = isUp ? 'var(--green)' : 'var(--red)';
                }
            }
        }

        // ===== 메인 루프 =====
        async function runCycle() {
            updateTime();

            // 1. 코인 목록 및 추천 갱신
            const signals = await fetchAgentSignals();
            renderCoinList(signals);

            const recs = await fetchRecommendations();
            renderRecommendations(recs);

            // 2. 선택된 코인 상세 분석 & 차트 갱신
            await updateChart();
            await fetchComprehensiveAnalysis(selectedSymbol);
        }

        // ===== 초기화 =====
        (async function init() {
            initChart();
            await runCycle(); // 첫 실행

            setInterval(runCycle, 5000); // 5초 주기 갱신
            setInterval(updateTime, 1000); // 1초 주기 시간 갱신
        })();

        // 탭 전환 이벤트
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                btn.classList.add('active');
                const tabId = btn.getAttribute('data-tab');
                document.getElementById(`tab-${tabId}`).classList.add('active');
            });
        });

        // 시간대 전환 이벤트
        document.querySelectorAll('.tf-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedTimeframe = btn.dataset.tf;
                updateChart();
            });
        });

    </script>
</body>

</html>
